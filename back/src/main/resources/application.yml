spring:
  application:
    name: gommit

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      # 사용자 업로드(CHECKIN/ITEM). 앱단 검증(5MB)보다 높게 잡아 5~12MB 는 FILE_TOO_LARGE(413) 로 떨어진다.
      max-file-size: 12MB
      max-request-size: 15MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true

  flyway:
    enabled: true

  http:
    clients:
      connect-timeout: 5s
      read-timeout: 5s

  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name} # Grafana 대시보드(JVM Micrometer)가 이 라벨로 필터링(Q29)
  info:
    env:
      enabled: true # info.* 노출 (기본 off)

info:
  app:
    # 이미지에 주입된 커밋 SHA. deploy.yml 이 배포 반영 확인에 사용
    revision: ${GIT_SHA:unknown}

point: # [임시값] 기획 확정 시 조정. 없으면 PointProperties 의 @DefaultValue 로 뜬다.
  check-in-reward: 10          # 개인 인증 1건
  group-daily-all-complete: 5  # 그룹 ACTIVE 전원이 그날 목표 달성
  merge-bonus: 150             # 챌린지 최종 완주(완료율 50% 이상) 시 개인에게 1회 지급

group: # 그룹장 강퇴 투표 설정
  kick-vote:     # 24 → 24시간 후 만료. 나중에 이 값만 수정하면 됨
    expiry-hours: 24

auth-token:
  access-token:
    expiration: 15m
  refresh-token:
    expiration: 30d
    reuse-grace-period: 3s

app:
  time-zone: Asia/Seoul # 인증 businessDate('오늘') 판정에 쓰는 Clock 빈의 기준 타임존
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  api-base-url: ${API_BASE_URL:http://localhost:8080}
  dailylog:
    ffmpeg-path: ${DAILYLOG_FFMPEG_PATH:ffmpeg} # 배포 이미지에 ffmpeg 없으면 몽타주 생성만 건너뛴다(graceful degrade)
    montage-max-rounds: 8 # 몽타주에 담는 최대 회차 수(회차당 2초)
    montage-sweep-cron: "0 0/15 4-17 * * *" # 마감 배치 — 인스턴스가 깨어 있는 04:00~17:45 KST 사이 15분 주기로 백로그를 조금씩 소진
    montage-sweep-lookback-days: 14 # 마감 배치가 거슬러 훑는 최대 일수 — 이보다 오래된 미생성 날은 재시도 포기(좀비 row 누적 방지)
    montage-sweep-max-per-run: 60 # sweep 1회(=15분 틱) 처리 상한, 재기동 직후 대량 백로그 대비
    montage-sweep-budget-seconds: 300 # sweep 1회 시간 예산 — ffmpeg 직렬 처리가 이 시간을 넘으면 남은 건 다음 틱으로.
    montage-executor: # 몽타주(ffmpeg) 전용 스레드풀 — 마감 무렵 이벤트가 몰려도 ffmpeg 동시 실행 수를 제한
      core-size: 1
      max-size: 1 # ffmpeg 인코딩은 CPU 100% — 버스터블 인스턴스에서 앱용 vCPU 를 남기려 동시 1개로 직렬화
      queue-capacity: 100 # 전원완료 이벤트가 마감 무렵 몰려도(활성 챌린지 수만큼) 큐에 담기게. 넘치면 AbortPolicy 로 버리고 마감 배치가 재시도

media:
  storage:
    provider: ${MEDIA_STORAGE_PROVIDER:local}   # local | cloudinary
    local:
      base-dir: ${MEDIA_LOCAL_BASE_DIR:./data/media}
      base-url: ${MEDIA_LOCAL_BASE_URL:http://localhost:8080/media}   # PUBLIC 정적 서빙 접두사.
    cloudinary:                                 # provider=cloudinary 일 때만 사용
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      root-folder: ${MEDIA_CLOUDINARY_ROOT_FOLDER:test-go-mmit}   # 계정 안 최상위 폴더. prod 는 go-mmit 로 오버라이드
    policies:
      # 영상은 2초 원본이라 이미지보다 커도(webm/mov 원본 기준) 10MB 로 여유. 최종 저장은 항상 mp4 로 재인코딩.
      CHECKIN:    { folder: check-ins,         max-size: 10MB, visibility: PRIVATE, allowed-content-types: [image/png, image/jpeg, image/webp, video/mp4, video/webm, video/quicktime] }
      DAILYLOG:   { folder: daily-check-ins,   max-size: 40MB, visibility: PRIVATE, allowed-content-types: [video/mp4] }
      ITEM:       { folder: character-store,   max-size: 5MB,  visibility: PUBLIC,  allowed-content-types: [image/png, image/jpeg, image/webp] }
      BACKGROUND: { folder: group-backgrounds, max-size: 5MB,  visibility: PUBLIC,  allowed-content-types: [image/png, image/jpeg, image/webp] }
