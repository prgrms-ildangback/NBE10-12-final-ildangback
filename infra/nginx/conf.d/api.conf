# api.go-mmit.site — 백엔드 리버스 프록시.
# Cloudflare(엣지 TLS) → nginx(오리진 TLS, Origin CA) → Spring(:8080).

server {
  listen 443 ssl;
  http2 on;
  server_name api.go-mmit.site;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # 공통 프록시 헤더
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_http_version 1.1;

  # 헬스체크 — 로그 제외
  location = /actuator/health {
    proxy_pass http://backend;
    access_log off;
  }

  # 비공개 미디어 스트리밍 — 버퍼링 끄고 타임아웃 늘림 (Q25).
  # 서버가 Cloudinary 원본을 받아 재스트리밍하는 경로.
  location /api/media/ {
    proxy_pass http://backend;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # 인증 엔드포인트 — 레이트리밋 (refresh 는 제외: 클라이언트가 자주 호출)
  location = /api/auth/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://backend;
  }
  location = /api/auth/signup {
    limit_req zone=auth burst=3 nodelay;
    proxy_pass http://backend;
  }
  # 비밀번호 변경 - 레이트리밋
  location = /api/users/me/password {
    limit_req zone=auth burst=3 nodelay;
    proxy_pass http://backend;
  }

  # 그룹 채팅 — 웹소켓 업그레이드 (STOMP, WebSocketConfig 의 /ws 엔드포인트. SockJS 없어 하위 경로 없음)
  location = /ws {
    proxy_pass http://backend;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # 나머지 API — 기본 버퍼링
  location /api/ {
    proxy_pass http://backend;
  }

  # 그 외 경로는 프론트(Workers) 몫
  location / {
    return 404;
  }
}

# Cloudflare 가 Full(strict)로 443 만 오리진에 연결하므로 80 리스너는 없음.
# (직접 접근은 보안그룹에서 Cloudflare IP 만 허용해 차단됨)
