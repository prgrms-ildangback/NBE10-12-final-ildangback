name: Deploy Backend

# Pull 배포 (infra-design.md Q30): build → promote(승인, back:prod 재태깅) → EC2 폴러가 배포 → verify.
# 롤백: Run workflow 에 이전 커밋 풀 SHA 입력 (runbook 3장).
# 프론트는 별도 워크플로(deploy-front.yml)가 처리 — Cloudflare 쪽 Git 연동이 끊겨 대체
on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - 'infra/docker/**'
      - 'infra/compose/**'
      - 'infra/nginx/**'
      - 'infra/monitoring/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: '롤백: 승격할 이전 커밋의 풀 SHA(40자). 비우면 선택한 브랜치를 빌드해 배포'
        required: false
        default: ''

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: inputs.rollback_sha == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # GHCR 는 소문자만 허용 → 리포 경로를 소문자로
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/back" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # prod 태그는 promote 에서만 — 승인 전엔 폴러가 반응하지 않게.
      - uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./infra/docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    needs: build
    # 롤백이면 build 가 skipped
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    # 필수 리뷰어 승인
    environment: production
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - id: target
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          set -euo pipefail
          SHA="${ROLLBACK_SHA:-$GITHUB_SHA}"
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::rollback_sha 는 40자 소문자 hex 커밋 SHA 여야 함: '$SHA'"
            exit 1
          fi
          {
            echo "sha=$SHA"
            echo "tag=${SHA::12}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/back"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag to prod
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          # 승격마다 annotation 으로 prod digest 를 바꿔, 같은 SHA 재승격도 폴러가 재배포하게 한다
          docker buildx imagetools create \
            --annotation "index:com.gommit.promote-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --tag "$IMAGE:prod" "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:prod"

  verify:
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - name: Wait for new revision
        env:
          # 컷오버 전 api-next, 이후 api
          VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL }}
          SHA: ${{ needs.promote.outputs.sha }}
        run: |
          set -uo pipefail
          if [ -z "$VERIFY_URL" ]; then
            echo "::error::repo variable DEPLOY_VERIFY_URL 미설정 (runbook 1-3)"
            exit 1
          fi
          BASE="${VERIFY_URL%/}"
          # 폴링 60s + up --wait 300s + 15s + 여유
          DEADLINE=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            REV=$(curl -fsS --max-time 10 "$BASE/actuator/info" | jq -r '.app.revision // empty' 2>/dev/null || true)
            HEALTH=$(curl -fsS --max-time 10 "$BASE/actuator/health" | jq -r '.status // empty' 2>/dev/null || true)
            echo "$(date -u +%H:%M:%S) revision=${REV:-?} health=${HEALTH:-?}"
            if [ "$REV" = "$SHA" ] && [ "$HEALTH" = "UP" ]; then
              echo "배포 확인: $BASE 가 $SHA 를 서빙 중"
              exit 0
            fi
            sleep 20
          done
          echo "::error::10분 안에 revision 이 $SHA 가 되지 않음. EC2 'journalctl -u team1-deploy-poller' 확인 — pull 실패면 GHCR PAT 만료 의심 (runbook 2장)."
          exit 1
